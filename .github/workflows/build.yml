name: Build WOPR

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, at :17 past (UTC)
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: [feeds.yaml, "sources/**", build.py, .github/workflows/build.yml]

permissions:
  contents: write   # to save data/items.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: newsfeed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch sources and build the page
        run: python build.py

      - name: Save the story archive
        run: |
          git config user.name "newsfeed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          if git diff --cached --quiet; then
            echo "No archive changes"
          else
            git commit -m "Update story archive"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
